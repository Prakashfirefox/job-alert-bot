name: Job Alert

on:
  schedule:
    # GitHub cron is in UTC. IST = UTC + 5:30
    # 11:00 IST = 05:30 UTC, 13:00 IST = 07:30 UTC,
    # 15:00 IST = 09:30 UTC, 19:00 IST = 13:30 UTC
    - cron: "30 5,7,9,13 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write         # needed to save seen_jobs.json back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Search jobs and notify
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_alert.py

      - name: Save seen jobs (avoid duplicate alerts)
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen_jobs.json || true
          git diff --cached --quiet || git commit -m "update seen jobs"
          git push || true
